name: Testes
on:
  push:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn test